name: Release MCP Server

on:
  push:
    tags: ['mcp-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Take the version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#mcp-v}"

      - name: Verify before publishing
        run: |
          pnpm -r test
          pnpm exec eslint .
          pnpm exec tsc --noEmit -p apps/ask/tsconfig.json
          pnpm exec tsc --noEmit -p apps/ask/client/tsconfig.json

      - name: Build
        run: pnpm --filter @dendiem/caliper build

      - name: Publish to npm
        working-directory: apps/ask
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
